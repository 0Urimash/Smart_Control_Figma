<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Control</title>
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
    <main class="container">
        <div class="card" id="info-login">
            <img src="https://img.cdndsgni.com/preview/13783263-m.jpg" 
              alt="Foto de perfil do Usuário" width="100" height="100">

            <form id="formLogin" method="get" action="dashboard.html">
                <h1>Smart Control</h1>

                <label for="nomeLogin">Nome:</label>
                <input type="text" name="nome" id="nomeLogin" placeholder="Digite seu nome." required>

                <label for="email">E-mail:</label>
                <input type="email" name="email" id="email" placeholder="Digite seu e-mail." required>

                <label for="senha">Senha:</label>
                <input type="password" name="senha" id="senha" placeholder="Digite sua senha." required>

                <a href="alterarsenha.html" class="forgot-link">Esqueceu a senha?</a>

                <button type="submit">Login</button>
                <button type="button" onclick="location.href='cadastro.html'">Cadastrar</button>

                <p class="footer-link"><a href="https://pedrotech.com.br/pedrolandia/" target="_blank">Portal Pedro Landia</a></p>
            </form>
        </div>
    </main>
</body>
</html>
