<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart-Control</title>
</head>
<body>
    <form method="post">
        <h1>Smart Control</h1>
        <div><img src="https://cdn-icons-png.flaticon.com/512/249/249187.png" alt="Foto de perfil" width="100" height="100"></div>
        
        <label for="email">Email:</label>
        <input type="text" name="email" id="email" placeholder="Digite o email..." required>

        <label for="senha">Senha:</label>
        <input type="text" name="senha" id="senha" placeholder="Digite a senha..." required>
        <a href="">Esqueceu a senha?</a>

        <button>Login</button>
        <button>Registrar</button>
    </form>
</body>
</html>
