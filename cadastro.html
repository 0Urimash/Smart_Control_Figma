<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Smart Control</title>
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
    <main class="container">
        <div class="card">
            <h1>Cadastrar</h1>
            <form id="formCadastro" method="post" action="#">
                <label for="nomeCadastro">Nome:</label>
                <input type="text" name="nome" id="nomeCadastro" placeholder="Digite seu nome" required>

                <label for="sobrenomeCadastro">Sobrenome:</label>
                <input type="text" name="sobrenome" id="sobrenomeCadastro" placeholder="Digite seu sobrenome">

                <label for="email">E-mail:</label>
                <input type="email" name="email" id="email" placeholder="Digite seu e-mail" required>

                <label for="senha">Senha:</label>
                <input type="password" name="senha" id="senha" placeholder="Digite sua senha" required>

                <button type="submit">Cadastrar</button>
                <button type="button" onclick="location.href='index.html'">Voltar</button>
            </form>
        </div>
    </main>

    <script src="assets/js/main.js"></script>
</body>
</html>
